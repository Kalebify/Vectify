<!--
  multicolor-input.svg — fixture de entrada del spike M2.1-S05.

  CÓMO SE OBTUVO (documentado también en el ADR, ver IMPL.md):
  El stack Docker no estaba corriendo en esta sesión (`docker compose ps`
  falló: "cannot connect to the docker API"), así que no se pudo ejecutar el
  flujo end-to-end POST /projects -> color-palette/detect -> confirm ->
  layers en vivo. En su lugar, este documento se compuso a partir de DOS
  fuentes 100% reales, ya producidas por corridas end-to-end anteriores del
  pipeline y presentes en el repo (no dibujadas a mano):

  1. Geometría de path: los 4 <g> de abajo son copias LITERALES (mismos
     comandos `d`, mismo `transform` interno) de 4 archivos SVG reales de
     salida de vectorización (Vectorization/VectorVersion), tomados de
     backend/Vectorify.Api/App_Data/uploads/**/vectors/*.svg de 4 proyectos
     subidos distintos durante QA real de M1/M2:
       - layer-donut  <- .../3acaec79b7fa4364b7fb419f4313933a/f0eb3ca627d2480297a7c97799c5584b/vectors/61af956a8cc041f1b70eaf6fa737ba1d.svg
       - layer-star   <- .../320268635b054491964910ef9a71efe8/a5625e8938e64ce9bfc1099e5927223d/vectors/15239243d2df4696be267319414377b9.svg
       - layer-glyphs <- .../2a2daf7581194a719e9173eb47b5d70e/f4e28f3e9f254a6ba9ea17bd31b6e8d6/vectors/e01ac1ba700f4b2a9241135a345350fa.svg
       - layer-blob   <- .../533261b4a828404b9e2bf21e7d7b1fde/e348333382a843cebde7f476e17468e6/vectors/462d01047f0345b799b27b1f5fcc64eb.svg
     (la salida real de vectorización es monocroma, fill="#000000": el
     color es metadata de dominio aplicada aparte, ver ColorGroup.ColorHex /
     VectorLayer.ColorHex en backend/Vectorify.Api).

  2. Color: los 4 fill de abajo son los 4 hex REALES detectados por
     color-palette/detect en la evidencia end-to-end de M2.1-S01, tal cual
     quedaron grabados en
     .sprint/3e8d77b2-6398-8166-bdd8-c969faca3d78/evidence/04_after_4colores_layer{1..4}_*.svg
     (#ff0000, #00c800, #ffdc00, #0000ff).

  Cada <g> imita la forma real del modelo VectorLayer (backend/Vectorify.Api/VectorLayers/VectorLayer.cs):
  data-group-id (~ GroupId), data-name (~ Name), data-color-hex (~ ColorHex),
  data-vector-id (~ VectorId), data-z-index, data-visible.
  Esto es lo que el spike parsea en src/shared/loadLayersFromSvg.ts.
-->
